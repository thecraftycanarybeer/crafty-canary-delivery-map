<!--
  Crafty Canary — Delivery Zone Map
  ----------------------------------
  Paste this whole file into a Shopify "Custom Liquid" / HTML section.
  No backend, no build step. Leaflet is loaded from a CDN; everything
  else (styles, boundary data, script) is inline.

  TO ADD OR REMOVE A DELIVERY DISTRICT:
    1. Edit the `deliveryPostcodes` array near the top of the <script>
       block below — just add or remove a district code string.
    2. Make sure a matching polygon feature (properties.name === that
       code) exists in the `districtBoundaries` GeoJSON further down.
       Boundary shapes here are trimmed from the free, open dataset at
       https://github.com/missinglink/uk-postcode-polygons
       (source: Ordnance Survey / ONS postcode boundaries, open licence).
       If a new district isn't in that dataset yet, pull its shape from
       the matching area file in that repo (e.g. geojson/NP.geojson),
       find the feature with the right "name", and add it to the
       "features" array in districtBoundaries.
    3. That's it — the map re-fits itself to whatever is in the array.
-->
<div id="cc-delivery-map-widget">
  <div class="cc-map-heading">
    <span class="cc-map-title">Delivery area</span>
    <span class="cc-map-sub">Local delivery covers the highlighted districts</span>
  </div>
  <div id="cc-delivery-map" role="application" aria-label="Map of Crafty Canary local delivery districts"></div>
  <div class="cc-map-legend">
    <span class="cc-swatch"></span> Delivery district
  </div>
</div>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
  #cc-delivery-map-widget {
    max-width: 720px;
    margin: 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #000;
    border: 2px solid #ffd100;
    border-radius: 10px;
    padding: 14px;
    box-sizing: border-box;
  }

  #cc-delivery-map-widget * {
    box-sizing: border-box;
  }

  .cc-map-heading {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 10px;
  }

  .cc-map-title {
    color: #ffd100;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .cc-map-sub {
    color: #bdbdbd;
    font-size: 12px;
  }

  #cc-delivery-map {
    width: 100%;
    height: 380px;
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
  }

  .cc-map-legend {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: #e5e5e5;
    font-size: 12px;
  }

  .cc-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #ffd100;
    border: 1px solid #000;
    border-radius: 2px;
  }

  /* Leaflet UI chrome restyled to match the brand */
  #cc-delivery-map .leaflet-control-zoom a {
    background: #111;
    color: #ffd100;
    border-color: #333 !important;
  }
  #cc-delivery-map .leaflet-control-zoom a:hover {
    background: #222;
  }
  #cc-delivery-map .leaflet-control-attribution {
    background: rgba(0, 0, 0, 0.6);
    color: #999;
  }
  #cc-delivery-map .leaflet-control-attribution a {
    color: #ffd100;
  }

  .cc-popup .leaflet-popup-content-wrapper {
    background: #000;
    color: #ffd100;
    border: 1px solid #ffd100;
    border-radius: 4px;
  }
  .cc-popup .leaflet-popup-content {
    margin: 8px 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .cc-popup .leaflet-popup-tip {
    background: #000;
    border: 1px solid #ffd100;
  }

  .cc-tooltip {
    background: #000;
    color: #ffd100;
    border: 1px solid #ffd100;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 6px;
  }
  .cc-tooltip::before {
    border-top-color: #ffd100;
  }

  /* Reference labels for notable towns — plain text, no box, so a
     handful of them don't clutter such a small map. */
  .cc-town-label {
    background: transparent;
    border: none;
    box-shadow: none;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    padding: 0 3px;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000;
  }
  .cc-town-label::before {
    display: none;
  }
</style>

    // block — the CSS already gives #cc-delivery-map a black background.
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri",
        maxZoom: 16
      }
    ).addTo(map);

    // Town/road label overlay — Esri's matching "Reference" layer, made
    // to sit on top of the Dark Gray base above with light-coloured
    // labels. Same free, no-key source. Placed in its own pane above
    // the district polygons so labels stay crisp instead of tinted by
    // the yellow fill. Delete this block if you'd rather have an
    // unlabelled map.
    map.createPane("labelsPane");
    map.getPane("labelsPane").style.zIndex = 450;
    map.getPane("labelsPane").style.pointerEvents = "none";
    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 16,
        pane: "labelsPane"
      }
    ).addTo(map);

    var activeFeatures = districtBoundaries.features.filter(function (f) {
      return deliveryPostcodes.indexOf(f.properties.name) !== -1;
    });

    var districtLayer = L.geoJSON(activeFeatures, {
      style: function () {
        return {
          color: BORDER_COLOUR,
          weight: 2,
          fillColor: FILL_COLOUR,
          fillOpacity: 0.45
        };
      },
      onEachFeature: function (feature, layer) {
        var code = feature.properties.name;
        layer.bindTooltip(code, {
          className: "cc-tooltip",
          sticky: true
        });
        layer.bindPopup(code + " - local delivery area", {
          className: "cc-popup"
        });
        layer.on("mouseover", function () {
          layer.setStyle({ fillOpacity: 0.65 });
        });
        layer.on("mouseout", function () {
          layer.setStyle({ fillOpacity: 0.45 });
        });
      }
    }).addTo(map);

    // Small reference markers for notable towns (see notableTowns near
    // the top). Non-interactive so they never intercept clicks meant
    // for the district polygons underneath.
    notableTowns.forEach(function (town) {
      L.circleMarker(town.latlng, {
        pane: "labelsPane",
        radius: 3,
        color: FILL_COLOUR,
        weight: 1,
        fillColor: "#000",
        fillOpacity: 1,
        interactive: false
      })
        .bindTooltip(town.name, {
          permanent: true,
          direction: "right",
          offset: [5, 0],
          className: "cc-town-label"
        })
        .addTo(map);
    });

    if (activeFeatures.length) {
      var fitToDistricts = function () {
        map.invalidateSize();
        map.fitBounds(districtLayer.getBounds(), { padding: [20, 20], animate: false });
        // Belt-and-braces: a fitBounds computed while the container had
        // zero size can leave polygon paths stuck at wrong/huge screen
        // coordinates even after the size is fixed, so force every path
        // to redraw explicitly too.
        districtLayer.eachLayer(function (layer) {
          if (layer.redraw) layer.redraw();
        });
      };
      fitToDistricts();

      // If this widget loads inside an iframe (its intended use on the
      // Shopify site) or any container that starts at zero size before
      // the surrounding page finishes laying it out, the fit above runs
      // against a 0-width map and gets the zoom permanently wrong. Watch
      // the container and re-fit the moment it actually has real size.
      if (typeof ResizeObserver !== "undefined") {
        var mapEl = document.getElementById("cc-delivery-map");
        var ro = new ResizeObserver(function (entries) {
          if (entries[0].contentRect.width > 0) {
            fitToDistricts();
            ro.disconnect();
          }
        });
        ro.observe(mapEl);
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initMap);
  } else {
    initMap();
  }
})();
</script>
